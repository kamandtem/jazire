name: jazireh_alefba
description: جزیره الفبا، برنامه آموزشی فارسی پایه اول
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  characters: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/maps/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Regular.ttf
    - family: WmTahriri
      fonts:
        - asset: assets/fonts/wm_Tahriri.ttf
