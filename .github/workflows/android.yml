name: build-android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Create missing platform folders
        run: flutter create --platforms=android .
      - name: Align Kotlin with Android plugins
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("android/settings.gradle")
          s = p.read_text()
          s = s.replace('id "org.jetbrains.kotlin.android" version "1.8.22"', 'id "org.jetbrains.kotlin.android" version "1.9.22"')
          s = s.replace("id 'org.jetbrains.kotlin.android' version '1.8.22'", "id 'org.jetbrains.kotlin.android' version '1.9.22'")
          p.write_text(s)
          PYCODE
          grep -n "kotlin.android" android/settings.gradle
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jazireh-alefba-apk
          path: build/app/outputs/flutter-apk/app-release.apk
