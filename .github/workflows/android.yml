name: build-android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Create missing platform folders
        run: flutter create --platforms=android .
      - name: Align Kotlin with Android plugins
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          settings = Path("android/settings.gradle")
          text = settings.read_text()
          text = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>1.9.22\g<2>',
              text,
          )
          settings.write_text(text)
          build = Path("android/build.gradle")
          if build.exists():
              text = build.read_text()
              text = re.sub(r'(kotlin_version\s*=\s*["\'])[^"\']+(["\'])', r'\g<1>1.9.22\g<2>', text)
              build.write_text(text)
          PYCODE
          grep -RIn "org.jetbrains.kotlin.android\|kotlin_version" android
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jazireh-alefba-apk
          path: build/app/outputs/flutter-apk/app-release.apk
